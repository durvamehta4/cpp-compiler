<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C++ Online Compiler</title>
<meta name="description" content="Fast, lightweight online C++ compiler. Write, compile and run C++ in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='14' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'%3EC++%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f8f8f8;--panel:#fff;--fg:#3b3b3b;--code:#000;--mute:#6e7681;--ln:#237893;--line:#e5e5e5;--acc:#005fb8;--ok:#388a34;--err:#e51400;--gut:#fff;--sel:rgba(0,90,200,.14);
  --k:#0000ff;--c:#af00db;--t:#267f99;--f:#795e26;--s:#a31515;--n:#098658;--cm:#008000;--v:#001080;--mc:#0070c1;--b0:#0431fa;--b1:#319331;--b2:#7b3814;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#181818;--panel:#1f1f1f;--fg:#cccccc;--code:#d4d4d4;--mute:#9d9d9d;--ln:#6e7681;--line:#2b2b2b;--acc:#0078d4;--ok:#89d185;--err:#f85149;--gut:#1f1f1f;--sel:rgba(255,255,255,.16);
  --k:#569cd6;--c:#c586c0;--t:#4ec9b0;--f:#dcdcaa;--s:#ce9178;--n:#b5cea8;--cm:#6a9955;--v:#9cdcfe;--mc:#4fc1ff;--b0:#ffd700;--b1:#da70d6;--b2:#179fff;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
header{position:sticky;top:0;z-index:1;flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:15px;margin-right:auto;white-space:nowrap}
select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{cursor:pointer}
.ic{display:inline-flex;align-items:center;gap:6px}
#fname{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:4px;padding:0 4px;margin-left:-5px;text-transform:none;letter-spacing:0;width:24ch;min-width:0}
#fname:hover,#fname:focus{border-color:var(--line);outline:0}
dialog{margin:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:20px;width:min(340px,calc(100vw - 32px));text-align:center}
dialog::backdrop{background:rgba(0,0,0,.55)}
#qrimg{background:#fff;border-radius:8px;padding:14px;width:232px;height:232px;margin:0 auto 14px;display:grid;place-items:center;color:#555}
#qrimg[hidden]{display:none}
#qrimg svg{width:100%;height:100%}
#qrmsg{font-size:13px;color:var(--mute);margin-bottom:12px}
.row{display:flex;gap:6px;margin-bottom:12px}
#qrurl{flex:1;min-width:0;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.row:has(#qrurl:placeholder-shown){display:none}
dialog form button{width:100%}
#run{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;min-width:84px}
#run:disabled{opacity:.6;cursor:wait}
main{flex:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);grid-template-rows:minmax(0,1fr);gap:1px;background:var(--line);min-height:0}
section{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;justify-content:space-between;padding:4px 10px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.ed{flex:1;display:flex;min-height:0;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#gut{padding:8px 6px 40px;text-align:right;color:var(--ln);background:var(--gut);overflow:hidden;user-select:none;white-space:pre;min-width:3em}
textarea{flex:1;resize:none;border:0;outline:0;padding:8px;background:transparent;color:inherit;font:inherit;tab-size:4;white-space:pre;overflow:auto}
/* syntax highlighting: coloured <pre> sits over a transparent-text textarea, so the caret and selection show through */
.wrap{position:relative;flex:1;min-width:0}
.wrap>*{position:absolute;inset:0;margin:0;padding:8px;font:inherit;tab-size:4;white-space:pre}
#hl{overflow:hidden;pointer-events:none;color:var(--code);padding:8px 48px 48px 8px;z-index:2}
#code{color:transparent;caret-color:var(--code);z-index:1}
#code::selection{background:var(--sel);color:transparent}
#hl .k{color:var(--k)}#hl .c{color:var(--c)}#hl .t{color:var(--t)}#hl .f{color:var(--f)}#hl .s{color:var(--s)}#hl .n{color:var(--n)}
#hl .cm{color:var(--cm)}#hl .v{color:var(--v)}#hl .mc{color:var(--mc)}#hl .b0{color:var(--b0)}#hl .b1{color:var(--b1)}#hl .b2{color:var(--b2)}
.right{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,2fr);min-height:0;gap:1px;background:var(--line)}
#out{flex:1;overflow:auto;padding:8px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#out .e{color:var(--err)}#out .m{color:var(--mute)}#out .ok{color:var(--ok)}
#fx{display:none}
@media (max-width:760px){body{height:auto;min-height:100dvh;overflow:visible}main{grid-template-columns:1fr;grid-template-rows:60vh auto}.right{grid-template-rows:120px 60vh}h1,.lbl{display:none}header{padding:6px 8px;gap:6px;flex-wrap:nowrap}header select{-webkit-appearance:none;appearance:none;padding:6px 4px;min-width:0;font-size:13px;text-align:center}#std{width:56px}#opt{width:38px}header .ic{padding:6px}#run{min-width:0;padding:6px 10px;flex:none}#cc{flex:1;min-width:0}}
</style>
<script>try{if(localStorage.getItem('ui')==='glass'){document.documentElement.className='glass';document.write('<link rel="stylesheet" href="/glass.css">')}}catch(e){}</script>
</head>
<body>
<div id="fx" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header>
  <h1>C++ Compiler</h1>
  <select id="cc" aria-label="Compiler"><option value="g162">GCC 16.2</option></select>
  <select id="std" aria-label="Standard">
    <option>c++11</option><option>c++14</option><option>c++17</option><option selected>c++20</option><option>c++23</option><option>c++2c</option><option>gnu++20</option><option>gnu++23</option>
  </select>
  <select id="opt" aria-label="Optimization"><option>-O0</option><option>-O1</option><option selected>-O2</option><option>-O3</option><option>-Os</option></select>
  <button id="ui" class="ic" aria-pressed="false" title="Switch to the glass UI"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9zM18.5 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg><span class="lbl">Glass</span></button>
  <button id="dl" class="ic" title="Download file (Ctrl+S)" aria-label="Download file"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 21h16"/></svg><span class="lbl">Download</span></button>
  <button id="qr" class="ic" title="Send to phone with a QR code" aria-label="Send to phone with a QR code"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3z"/></svg><span class="lbl">To phone</span></button>
  <button id="run" title="Ctrl/Cmd + Enter">▶ Run</button>
</header>
<main>
  <section>
    <div class="bar"><input id="fname" value="main.cpp" spellcheck="false" autocomplete="off" aria-label="File name"><span id="pos">1:1</span></div>
    <div class="ed"><div id="gut">1</div><div class="wrap"><pre id="hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code"></textarea></div></div>
  </section>
  <div class="right">
    <section><div class="bar"><span>stdin</span></div><div class="ed"><textarea id="stdin" spellcheck="false" aria-label="Standard input"></textarea></div></section>
    <section><div class="bar"><span>output</span><span id="stat"></span></div><pre id="out" aria-live="polite"><span class="m">Press Run or Ctrl+Enter.</span></pre></section>
  </div>
</main>
<dialog id="dlg">
  <div id="qrimg"></div>
  <p id="qrmsg"></p>
  <div class="row"><input id="qrurl" readonly placeholder=" " aria-label="Download link"><button id="qrcopy">Copy</button></div>
  <form method="dialog"><button>Close</button></form>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
const code = $('code'), gut = $('gut'), hl = $('hl'), out = $('out'), stat = $('stat'), run = $('run'), outSec = out.closest('section');
const DEMO = `#include <iostream>
using namespace std;

int main()
{
    return 0;
}
`;

// ---- persistence ----
// sessionStorage: survives reload of this tab, but a new tab starts fresh
const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} } };
const state = () => ({ name: $('fname').value, code: code.value, stdin: $('stdin').value, compiler: $('cc').value, std: $('std').value, opt: $('opt').value });
function apply(s) {
  if (s.name) $('fname').value = s.name;
  if (s.code != null) code.value = s.code;
  if (s.stdin != null) $('stdin').value = s.stdin;
  for (const [k, id] of [['std', 'std'], ['opt', 'opt']]) if (s[k]) $(id).value = s[k];
  if (s.compiler) { $('cc').dataset.want = s.compiler; $('cc').value = s.compiler; if (!$('cc').value) $('cc').selectedIndex = 0; }
}
const save = () => store.set('cpp', JSON.stringify(state()));

// ---- syntax highlighting (VS Code Light+/Dark+ colours, bracket-pair colours) ----
const words = (s) => new Set(s.split(' '));
const CTRL = words('break case catch continue co_await co_return co_yield default delete do else for goto if new operator return switch throw try using while');
const KW = words('alignas alignof asm auto bool char char8_t char16_t char32_t class concept const consteval constexpr constinit const_cast decltype double dynamic_cast enum explicit export extern false float friend inline int long mutable namespace noexcept nullptr private protected public register reinterpret_cast requires short signed sizeof static static_assert static_cast struct template this thread_local true typedef typeid typename union unsigned virtual void volatile wchar_t');
const TYPES = words('std string string_view vector array deque list forward_list map multimap set multiset unordered_map unordered_multimap unordered_set unordered_multiset stack queue priority_queue pair tuple bitset optional variant any function unique_ptr shared_ptr weak_ptr span complex numeric_limits size_t ptrdiff_t int8_t int16_t int32_t int64_t uint8_t uint16_t uint32_t uint64_t istream ostream iostream ifstream ofstream fstream stringstream istringstream ostringstream chrono mt19937 mt19937_64 ranges views');
//            comment                              | string / char / raw string                                        | #directive   <header>       | number                                 | identifier (call?)
const TOK = /(\/\/.*|\/\*[\s\S]*?(?:\*\/|(?![\s\S])))|(R"([^(\s]*)\([\s\S]*?\)\3"|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(^[ \t]*#[ \t]*\w+)([ \t]*<[^>\n]*>)?|((?:\d|\.\d)(?:[eEpP][+-]|[\w.'])*)|([A-Za-z_]\w*)(?=(\s*\()?)/gm;
const span = (c, t) => `<span class="${c}">${esc(t)}</span>`;
function token(m) {
  const [, cm, str, , pp, inc, num, id, call] = m;
  if (cm) return span('cm', cm);
  if (str) return span('s', str);
  if (pp) return span('c', pp) + (inc ? span('s', inc) : '');
  if (num) return span('n', num);
  if (CTRL.has(id)) return span('c', id);
  if (KW.has(id)) return span('k', id);
  if (call) return span('f', id);
  if (TYPES.has(id)) return span('t', id);
  if (/^[A-Z][A-Z0-9]*_[A-Z0-9_]*$|^[A-Z]{3,}\d*$/.test(id)) return span('mc', id);
  return span('v', id);
}
function paint() {
  const v = code.value; let h = '', i = 0, depth = 0, m;
  const gap = (t) => esc(t).replace(/[()[\]{}]/g, (b) => span('b' + ('([{'.includes(b) ? depth++ : (depth = Math.max(0, depth - 1))) % 3, b));
  for (TOK.lastIndex = 0; (m = TOK.exec(v)); i = TOK.lastIndex) h += gap(v.slice(i, m.index)) + token(m);
  hl.innerHTML = h + gap(v.slice(i)) + ' ';
}

// ---- editor: gutter, tab, auto-indent, bracket close ----
function lines() {
  const n = code.value.split('\n').length;
  if (gut.dataset.n != n) { gut.dataset.n = n; gut.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n'); }
  paint();
}
function pos() {
  const b = code.value.slice(0, code.selectionStart).split('\n');
  $('pos').textContent = `${b.length}:${b.at(-1).length + 1}`;
}
const ins = (t) => document.execCommand('insertText', false, t) || code.setRangeText(t, code.selectionStart, code.selectionEnd, 'end');
code.addEventListener('input', () => { lines(); pos(); save(); });
code.addEventListener('scroll', () => { gut.scrollTop = hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft; });
['click', 'keyup'].forEach((e) => code.addEventListener(e, pos));
code.addEventListener('keydown', (e) => {
  const { selectionStart: s, selectionEnd: t, value: v } = code;
  if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    if (e.shiftKey) {
      const ls = v.lastIndexOf('\n', s - 1) + 1, m = v.slice(ls).match(/^ {1,4}/);
      if (m) { code.setSelectionRange(ls, ls + m[0].length); ins(''); code.setSelectionRange(s - m[0].length, s - m[0].length); }
    } else ins('    ');
  } else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    e.preventDefault();
    const ln = v.slice(v.lastIndexOf('\n', s - 1) + 1, s), ind = ln.match(/^\s*/)[0];
    if (/\{\s*$/.test(ln) && v[t] === '}') { ins(`\n${ind}    \n${ind}`); const p = code.selectionStart - ind.length - 1; code.setSelectionRange(p, p); }
    else ins('\n' + ind + (/\{\s*$/.test(ln) ? '    ' : ''));
  } else if (e.key === '}' && s === t && /^\s+$/.test(v.slice(v.lastIndexOf('\n', s - 1) + 1, s))) {
    e.preventDefault();
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    code.setSelectionRange(Math.max(ls, s - 4), s); ins('}');
  } else if ('([{"\''.includes(e.key) && s !== t) {
    e.preventDefault();
    ins(e.key + v.slice(s, t) + { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" }[e.key]);
  }
});

// ---- run ----
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
async function go() {
  if (run.disabled) return;
  run.disabled = true; run.textContent = 'Running…'; stat.textContent = ''; delete outSec.dataset.res;
  out.innerHTML = '<span class="m">Compiling…</span>';
  try {
    const r = await fetch('/api/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(state()) });
    const d = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    if (d.error) throw new Error(d.error);
    let h = '';
    if (d.compile) h += `<span class="${d.stdout || d.status === '0' ? 'm' : 'e'}">${esc(d.compile)}</span>\n`;
    if (d.stdout) h += esc(d.stdout);
    if (d.stderr) h += `<span class="e">${esc(d.stderr)}</span>`;
    out.innerHTML = h || '<span class="m">(no output)</span>';
    const ok = d.status === '0';
    outSec.dataset.res = ok ? 'ok' : 'err';
    stat.innerHTML = `<span style="color:var(--${ok ? 'ok' : 'err'})">${d.signal ? esc(d.signal) : 'exit ' + esc(String(d.status ?? '?'))}</span> · ${d.ms} ms${d.engine ? ' · ' + esc(d.engine) : ''}`;
  } catch (err) {
    out.innerHTML = `<span class="e">${esc(err.message)}</span>`;
    outSec.dataset.res = 'err';
  } finally {
    run.disabled = false; run.textContent = '▶ Run';
    out.classList.remove('pop'); void out.offsetWidth; out.classList.add('pop');
  }
}
run.onclick = go;
addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  if (e.key === 'Enter') { e.preventDefault(); go(); }
  else if (e.key.toLowerCase() === 's') { e.preventDefault(); download(); }
});
['stdin', 'std', 'opt', 'cc'].forEach((id) => $(id).addEventListener('change', save));
['stdin', 'fname'].forEach((id) => $(id).addEventListener('input', save));

// ---- download on this device / send to phone via QR ----
const fname = () => { const n = $('fname').value.trim() || 'main.cpp'; return /\.\w+$/.test(n) ? n : n + '.cpp'; };
function download() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([code.value], { type: 'text/x-c++src' }));
  a.download = fname();
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let qrLib; // QR generator is only downloaded the first time it's needed
const loadQr = () => (qrLib ||= new Promise((ok, no) => {
  const sc = document.createElement('script');
  sc.src = '/qr.js';
  sc.onload = () => ok(window.qrcode);
  sc.onerror = () => { qrLib = null; no(new Error('Could not load the QR generator.')); };
  document.head.append(sc);
}));
async function toPhone() {
  const img = $('qrimg'), msg = $('qrmsg'), link = $('qrurl');
  img.hidden = false; img.textContent = 'Uploading…'; msg.textContent = ''; link.value = '';
  $('dlg').showModal();
  try {
    const [d, qrcode] = await Promise.all([
      fetch('/api/save', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: code.value, name: fname() }) })
        .then(async (r) => { const d = await r.json().catch(() => ({ error: `HTTP ${r.status}` })); if (d.error) throw new Error(d.error); return d; }),
      loadQr(),
    ]);
    const q = qrcode(0, 'M');
    q.addData(d.url);
    q.make();
    img.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    msg.textContent = `Scan with your phone camera to download ${d.name}. The link works for ${d.days} days.`;
    link.value = d.url;
  } catch (err) {
    img.hidden = true;
    msg.textContent = err.message;
  }
}
$('dl').onclick = download;
$('qr').onclick = toPhone;
$('qrcopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('qrurl').value); $('qrcopy').textContent = 'Copied'; }
  catch { $('qrurl').select(); }
  setTimeout(() => ($('qrcopy').textContent = 'Copy'), 1500);
};

// ---- UI style: lightweight (default) or glass; the glass stylesheet is only downloaded when used ----
const root = document.documentElement, ui = $('ui');
const glassOn = () => root.classList.contains('glass');
function glassCss() {
  let l = document.querySelector('link[href="/glass.css"]');
  if (l?.sheet) return Promise.resolve();
  if (!l) { l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/glass.css'; document.head.append(l); }
  return new Promise((ok) => { l.onload = ok; l.onerror = () => { l.remove(); ok(); }; });
}
function syncUi() {
  const on = glassOn();
  ui.setAttribute('aria-pressed', on);
  ui.title = on ? 'Switch to the lightweight UI' : 'Switch to the glass UI';
  ui.querySelector('.lbl').textContent = on ? 'Lite' : 'Glass';
}
ui.onclick = async () => {
  const on = !glassOn();
  if (on) await glassCss();
  try { localStorage.setItem('ui', on ? 'glass' : 'lite'); } catch {}
  const flip = () => { root.classList.toggle('glass', on); syncUi(); };
  if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return flip();
  const r = ui.getBoundingClientRect();
  root.style.setProperty('--vx', r.left + r.width / 2 + 'px');
  root.style.setProperty('--vy', r.top + r.height / 2 + 'px');
  document.startViewTransition(flip);
};
// glass only: light that follows the pointer, ripple on click
addEventListener('pointermove', (e) => {
  const p = glassOn() && e.target.closest?.('section, header');
  if (!p) return;
  const r = p.getBoundingClientRect();
  p.style.setProperty('--mx', e.clientX - r.left + 'px');
  p.style.setProperty('--my', e.clientY - r.top + 'px');
}, { passive: true });
addEventListener('pointerdown', (e) => {
  const b = glassOn() && e.target.closest?.('button');
  if (!b) return;
  const r = b.getBoundingClientRect();
  b.style.setProperty('--rx', e.clientX - r.left + 'px');
  b.style.setProperty('--ry', e.clientY - r.top + 'px');
  b.classList.remove('rip'); void b.offsetWidth; b.classList.add('rip');
});

// ---- init ----
(async () => {
  let s = null;
  try { s = JSON.parse(store.get('cpp')); } catch {}
  apply(s || { code: DEMO });
  lines(); pos(); syncUi();

  try {
    const list = await (await fetch('/api/compilers?v=2')).json();
    if (Array.isArray(list) && list.length) {
      const cc = $('cc'), want = cc.dataset.want;
      cc.innerHTML = list.map((c) => `<option value="${esc(c.name)}">${esc(c.label)}</option>`).join('');
      cc.value = list.some((c) => c.name === want) ? want : list[0].name;
    }
  } catch {}
})();
</script>
</body>
</html>
